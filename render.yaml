# Render 部署配置（免费档）
# 说明：本项目是纯 Python 标准库服务，无第三方依赖，不需要 requirements.txt。
# Render 会自动识别这是 Python Web 服务，按下方 startCommand 启动。

services:
  - type: web
    name: medical-knowledge-hub
    runtime: python
    plan: free
    # 监听 0.0.0.0:$PORT，server.py 已支持
    startCommand: python server.py --no-browser
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MEDKG_AI
        value: "1"
      - key: MEDQA_API_KEY
        sync: false          # 部署后在 Render 控制台手动填入 Agnes API Key
      - key: MEDQA_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: MEDQA_MODEL
        value: agnes-2.5-flash
      - key: MEDKG_VEC
        value: "0"           # 云端无 Ollama embedding，关闭向量检索（自动退回图谱+字面）
    healthCheckPath: /api/bootstrap
